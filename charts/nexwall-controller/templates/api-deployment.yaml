apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexwall.fullname" . }}-api
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      component: api
      tenant-id: "{{ .Values.tenantId }}"
  template:
    metadata:
      labels:
        {{- include "nexwall.labels" . | nindent 8 }}
        component: api
    spec:
      # Must share a node with the vpn pod: both mount the same ReadWriteOnce
      # ovpn-data volume (the cert material the API reads to answer /units).
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  component: vpn
                  tenant-id: "{{ .Values.tenantId }}"
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: {{ include "nexwall.image" (dict "root" $ "component" "api") }}
          envFrom:
            - secretRef:
                name: {{ include "nexwall.fullname" . }}-api-env
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: ovpn-data
              mountPath: /etc/openvpn
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
      volumes:
        - name: ovpn-data
          persistentVolumeClaim:
            claimName: {{ include "nexwall.fullname" . }}-ovpn-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexwall.fullname" . }}-api
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
spec:
  selector:
    component: api
    tenant-id: "{{ .Values.tenantId }}"
  ports:
    - port: 5000
