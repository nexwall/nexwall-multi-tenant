apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexwall.fullname" . }}-ui
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
    component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      component: ui
      tenant-id: "{{ .Values.tenantId }}"
  template:
    metadata:
      labels:
        {{- include "nexwall.labels" . | nindent 8 }}
        component: ui
    spec:
      containers:
        - name: ui
          image: {{ include "nexwall.image" (dict "root" $ "component" "ui") }}
          ports:
            - containerPort: 3000
          resources:
            {{- toYaml .Values.resources.ui | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexwall.fullname" . }}-ui
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
spec:
  selector:
    component: ui
    tenant-id: "{{ .Values.tenantId }}"
  ports:
    - port: 3000
