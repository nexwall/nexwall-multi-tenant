apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexwall.fullname" . }}-proxy
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
    component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      component: proxy
      tenant-id: "{{ .Values.tenantId }}"
  template:
    metadata:
      labels:
        {{- include "nexwall.labels" . | nindent 8 }}
        component: proxy
    spec:
      # Same ovpn-data-colocation constraint as api-deployment.yaml.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  component: vpn
                  tenant-id: "{{ .Values.tenantId }}"
              topologyKey: kubernetes.io/hostname
      containers:
        - name: proxy
          image: {{ include "nexwall.image" (dict "root" $ "component" "proxy") }}
          # TODO(phase-1): confirm exact env var names against
          # nexwall-controller/proxy/entrypoint.sh before first real deploy —
          # these are the names inferred from its generated api.yaml/ui.yaml,
          # not yet verified 1:1.
          env:
            - name: API_ADDRESS
              value: "{{ include "nexwall.fullname" . }}-api:5000"
            - name: UI_ADDRESS
              value: "{{ include "nexwall.fullname" . }}-ui:3000"
            - name: PROXY_PORT
              value: "8080"
          volumeMounts:
            - name: ovpn-data
              mountPath: /etc/openvpn
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.resources.proxy | nindent 12 }}
      volumes:
        - name: ovpn-data
          persistentVolumeClaim:
            claimName: {{ include "nexwall.fullname" . }}-ovpn-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexwall.fullname" . }}-proxy
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
spec:
  selector:
    component: proxy
    tenant-id: "{{ .Values.tenantId }}"
  ports:
    - port: 8080
