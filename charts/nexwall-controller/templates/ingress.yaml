apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nexwall.fullname" . }}
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.subdomain }}]
      secretName: wildcard-painel-tls # shared wildcard cert, see infra/k3s README
  rules:
    - host: {{ .Values.subdomain }}
      http:
        paths:
          # The proxy container already routes /api, /grafana, /prometheus
          # internally (see nexwall-controller/proxy/entrypoint.sh + the
          # grafana.yaml/prometheus.yaml route files dropped into its watched
          # config dir) — so the Ingress only needs one backend: the proxy.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nexwall.fullname" . }}-proxy
                port: { number: 8080 }
