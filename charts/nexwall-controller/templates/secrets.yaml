apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexwall.fullname" . }}-api-env
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Mirrors dev-nexwall.sh's api.env, with PROMTAIL_ADDRESS pointed at the
  # promtail Service's in-namespace DNS name instead of the 127.0.0.1 bug
  # found and fixed in the single-VM dev harness.
  #
  # TODO(phase-1): verify VPN clients can actually reach this ClusterIP
  # through the vpn pod's tunnel (needs ip_forward + the vpn pod's NET_ADMIN
  # capability to route tunnel traffic into the cluster's Service network —
  # same mechanism that let the single-VM host-networking setup work, not
  # yet proven inside a CNI pod network).
  LISTEN_ADDRESS: "0.0.0.0:5000"
  ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  SECRET_JWT: {{ .Values.secrets.secretJwt | quote }}
  PROMTAIL_ADDRESS: "{{ include "nexwall.fullname" . }}-promtail"
  PROMTAIL_PORT: "1514"
  PROMETHEUS_PATH: "/prometheus"
  PROMETHEUS_AUTH_USERNAME: {{ .Values.secrets.prometheusAuthUsername | quote }}
  PROMETHEUS_AUTH_PASSWORD: {{ .Values.secrets.prometheusAuthPassword | quote }}
  GRAFANA_PATH: "/grafana"
  WEBSSH_PATH: "webssh-{{ .Values.tenantId }}"
  REGISTRATION_TOKEN: {{ .Values.secrets.registrationToken | quote }}
  DATA_DIR: "data"
  OVPN_DIR: "/etc/openvpn"
  REPORT_DB_URI: "postgres://report:{{ .Values.secrets.postgresPassword }}@{{ include "nexwall.fullname" . }}-db:5432/report"
  GRAFANA_POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  ISSUER_2FA: {{ .Values.slug | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  GIN_MODE: "release"
  FQDN: {{ .Values.subdomain | quote }}
  VALID_SUBSCRIPTION: "true"
  SECRETS_DIR: "secrets"
  PLATFORM_INFO: '{"vpn_port": "{{ .Values.vpnPort }}", "vpn_network": "{{ .Values.vpnCidr }}", "controller_version": "{{ .Values.image.tag }}", "metrics_retention_days": {{ .Values.monitoring.retentionDays }}, "logs_retention_days": 180}'
