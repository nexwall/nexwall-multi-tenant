{{- $fn := include "nexwall.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-api-env
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
type: Opaque
stringData:
  LISTEN_ADDRESS: "0.0.0.0:5000"
  # The username IS the login email — this is what makes ADR 0008's
  # single-domain identity model work: the Management Plane always sends
  # the email as the username when it replays a login against this tenant.
  ADMIN_USERNAME: {{ .Values.adminEmail | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  REGISTRATION_TOKEN: {{ .Values.secrets.registrationToken | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- if .Values.handoffSecret }}
  # ADR 0001 (nexwall-controller) / ADR 0009 (this repo). Empty means the
  # feature is off for this tenant -- nexwall-controller treats a missing
  # env var the same way, deliberately not a fatal startup error there.
  SSO_HANDOFF_SECRET: {{ .Values.handoffSecret | quote }}
  {{- end }}
  ISSUER_2FA: {{ .Values.slug | quote }}
  GIN_MODE: "release"
  FQDN: {{ .Values.subdomain | quote }}
  VALID_SUBSCRIPTION: "true"
  # Persistent state (mounted from the api-data PVC, see controller.yaml)
  DATA_DIR: "/nethsecurity-api/data"
  SECRETS_DIR: "/nethsecurity-api/secrets"
  TOKENS_DIR: "/nethsecurity-api/tokens"
  CREDENTIALS_DIR: "/nethsecurity-api/credentials"
  # OpenVPN — api/entrypoint.sh copies OVPN_NETMASK into conf.env for the
  # vpn hooks; the dev harness never set it (empty netmask on ifconfig-push).
  OVPN_DIR: "/etc/openvpn"
  OVPN_NETWORK: {{ include "nexwall.vpnNetwork" . | quote }}
  OVPN_NETMASK: "255.255.0.0"
  OVPN_UDP_PORT: {{ .Values.vpnPort | quote }}
  # Units reach promtail through the tunnel, at the VPN server address.
  PROMTAIL_ADDRESS: {{ include "nexwall.vpnServerIP" . | quote }}
  PROMTAIL_PORT: "1514"
  PROMETHEUS_PATH: "/prometheus"
  PROMETHEUS_AUTH_USERNAME: {{ .Values.secrets.prometheusAuthUsername | quote }}
  PROMETHEUS_AUTH_PASSWORD: {{ .Values.secrets.prometheusAuthPassword | quote }}
  GRAFANA_PATH: "/grafana"
  GRAFANA_POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  WEBSSH_PATH: "webssh-{{ .Values.tenantId }}"
  REPORT_DB_URI: "postgres://report:{{ .Values.secrets.postgresPassword }}@{{ $fn }}-db:5432/report"
  PLATFORM_INFO: '{"vpn_port": "{{ .Values.vpnPort }}", "vpn_network": "{{ .Values.vpnCidr }}", "controller_version": "{{ .Values.image.tag }}", "metrics_retention_days": {{ .Values.monitoring.retentionDays }}, "logs_retention_days": {{ .Values.monitoring.logsRetentionDays }}}'
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-db
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: report
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-grafana
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
