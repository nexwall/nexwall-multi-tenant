apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nexwall.fullname" . }}-ovpn-data
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.storage.ovpnSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexwall.fullname" . }}-vpn
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
    component: vpn
spec:
  replicas: 1
  strategy: { type: Recreate } # single ReadWriteOnce volume, no rolling
  selector:
    matchLabels:
      component: vpn
      tenant-id: "{{ .Values.tenantId }}"
  template:
    metadata:
      labels:
        {{- include "nexwall.labels" . | nindent 8 }}
        component: vpn
    spec:
      containers:
        - name: vpn
          image: {{ include "nexwall.image" (dict "root" $ "component" "vpn") }}
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: ovpn-data
              mountPath: /etc/openvpn
            - name: dev-net-tun
              mountPath: /dev/net/tun
          ports:
            - containerPort: 1194
              protocol: UDP
          resources:
            {{- toYaml .Values.resources.vpn | nindent 12 }}
      volumes:
        - name: ovpn-data
          persistentVolumeClaim:
            claimName: {{ include "nexwall.fullname" . }}-ovpn-data
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexwall.fullname" . }}-vpn
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    component: vpn
    tenant-id: "{{ .Values.tenantId }}"
  ports:
    - port: 1194
      name: openvpn
      protocol: UDP
---
# Separate NodePort Service just for the public-facing OpenVPN port
# (see docs/adr/0004 for the tenant_id -> port scheme).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexwall.fullname" . }}-vpn-public
  labels:
    {{- include "nexwall.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    component: vpn
    tenant-id: "{{ .Values.tenantId }}"
  ports:
    - port: 1194
      targetPort: 1194
      nodePort: {{ .Values.vpnPort }}
      protocol: UDP
